name: Build and Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # osdagbridge-desktop is pure Python (noarch: python), so it is built and
  # tested once here instead of once per OS.
  build-package:
    name: Build Desktop Conda package (noarch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Miniforge ships a recent conda with the libmamba solver and conda-forge
      # preconfigured: no slow "update conda" step, solves take seconds.
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          conda-remove-defaults: "true"

      - name: Install build tools
        shell: bash -l {0}
        run: |
          conda install -y conda-build
          conda config --set solver libmamba

      - name: Build Desktop Conda package
        shell: bash -l {0}
        run: |
          conda-build conda-recipe -c gsrathore -c osdag -c geompy -c conda-forge --output-folder conda-out

      # Handed straight to the installer jobs, so the installers always contain
      # exactly this build, independent of the Anaconda upload below.
      - name: Save built package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-conda-package
          path: conda-out/noarch/osdagbridge-desktop-*.conda
          if-no-files-found: error

  # Publishes the package so `conda install osdagbridge-desktop` users get it.
  # The installers do not depend on it, so it runs in parallel with them.
  upload-package:
    name: Upload Desktop package to Anaconda
    needs: build-package
    runs-on: ubuntu-latest
    steps:
      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: desktop-conda-package
          path: conda-out

      - name: Upload to Anaconda
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          if [ -z "$ANACONDA_API_TOKEN" ]; then
            echo "ANACONDA_TOKEN not set; skipping upload."
            exit 0
          fi
          pip install --quiet anaconda-client
          anaconda upload conda-out/*.conda --force

  build-installer:
    name: Build ${{ matrix.name }} installer
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            platform: win
            ext: exe
            final: OsdagBridge-Setup.exe
            artifact: windows-installer
          - os: ubuntu-latest
            name: Linux
            platform: linux
            ext: sh
            final: OsdagBridge-Linux.sh
            artifact: linux-installer
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          conda-remove-defaults: "true"

      - name: Install constructor
        shell: bash -l {0}
        run: |
          conda install -y constructor conda-index
          conda config --set solver libmamba

      # Turn the package built above into a local channel and put it first in
      # construct.yaml (on the runner only), so constructor bundles this exact
      # build instead of whatever osdagbridge-desktop is on Anaconda.
      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: desktop-conda-package
          path: local-channel/noarch

      - name: Use built package as local channel
        shell: bash -l {0}
        run: |
          mkdir -p local-channel/${{ matrix.platform == 'win' && 'win-64' || 'linux-64' }}
          python -m conda_index local-channel
          python - <<'EOF'
          from pathlib import Path
          uri = Path("local-channel").resolve().as_uri()
          p = Path("constructor/construct.yaml")
          text = p.read_text(encoding="utf-8")
          p.write_text(text.replace("channels:\n", f"channels:\n  - {uri}\n", 1), encoding="utf-8")
          print("Added local channel", uri)
          EOF
          grep -A6 "^channels:" constructor/construct.yaml

      # openseespy / opsvis only exist on PyPI. Their wheels are bundled into
      # the installer and installed offline by post_install, so installing
      # needs no internet and no slow PyPI round-trips.
      - name: Download bundled pip wheels
        shell: bash -l {0}
        run: |
          python constructor/fetch_wheels.py --platform ${{ matrix.platform }}

      - name: Build installer with constructor
        shell: bash -l {0}
        run: |
          constructor constructor/ --output-dir dist

      - name: Rename installer
        shell: bash
        run: |
          SRC=$(find dist -maxdepth 1 -iname "*.${{ matrix.ext }}" | head -n 1)
          echo "Built installer: $SRC"
          cp "$SRC" "dist/${{ matrix.final }}"

      # Install for real (Linux only; runs in parallel with the Windows build so
      # it adds no wall-clock time) and check the offline wheel install worked.
      - name: Smoke-test installer
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          PREFIX_DIR="$RUNNER_TEMP/osdagbridge-test"
          START=$(date +%s)
          bash "dist/${{ matrix.final }}" -b -p "$PREFIX_DIR"
          echo "Install took $(( $(date +%s) - START ))s"
          test ! -d "$PREFIX_DIR/osdagbridge_wheels" || { echo "wheel dir not cleaned up" >&2; exit 1; }
          grep -q "local-channel" "$PREFIX_DIR"/conda-meta/osdagbridge-desktop-*.json \
            || { echo "osdagbridge-desktop was not taken from this run's build" >&2; exit 1; }
          MPLBACKEND=Agg "$PREFIX_DIR/bin/python" -c "import openseespy.opensees, opsvis, osdagbridge_core, osdagbridge_desktop; print('imports OK')"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.final }}

  release:
    name: Create GitHub Release
    needs: build-installer
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: linux-installer
          path: dist

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OsdagBridge-Setup.exe
            dist/OsdagBridge-Linux.sh
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
