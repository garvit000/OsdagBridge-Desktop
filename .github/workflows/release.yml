name: Build and Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # osdagbridge-desktop is pure Python (noarch: python), so it is built and
  # tested once here instead of once per OS.
  build-package:
    name: Build Desktop Conda package (noarch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Miniforge ships a recent conda with the libmamba solver and conda-forge
      # preconfigured: no slow "update conda" step, solves take seconds.
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          conda-remove-defaults: "true"

      - name: Install build tools
        shell: bash -l {0}
        run: |
          conda install -y conda-build anaconda-client
          conda config --set solver libmamba

      - name: Build Desktop Conda package
        shell: bash -l {0}
        run: |
          conda-build conda-recipe -c gsrathore -c osdag -c geompy -c conda-forge --output-folder conda-out

      - name: Upload Conda package to Anaconda
        shell: bash -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          PACKAGE=$(find conda-out -name "osdagbridge-desktop-*.conda" -o -name "osdagbridge-desktop-*.tar.bz2" | head -n 1)
          if [ -z "$PACKAGE" ]; then
            echo "No package found in conda-out" >&2
            exit 1
          fi
          if [ -z "$ANACONDA_API_TOKEN" ]; then
            echo "ANACONDA_TOKEN not set; installers will use the package already on the channel."
            exit 0
          fi
          echo "Uploading $PACKAGE to Anaconda..."
          # The installers below resolve osdagbridge-desktop from the channel,
          # so a failed upload must fail the release instead of silently
          # shipping the previous build.
          anaconda upload "$PACKAGE" --force

  build-installer:
    name: Build ${{ matrix.name }} installer
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            platform: win
            ext: exe
            final: OsdagBridge-Setup.exe
            artifact: windows-installer
          - os: ubuntu-latest
            name: Linux
            platform: linux
            ext: sh
            final: OsdagBridge-Linux.sh
            artifact: linux-installer
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          conda-remove-defaults: "true"

      - name: Install constructor
        shell: bash -l {0}
        run: |
          conda install -y constructor
          conda config --set solver libmamba

      # openseespy / opsvis only exist on PyPI. Their wheels are bundled into
      # the installer and installed offline by post_install, so installing
      # needs no internet and no slow PyPI round-trips.
      - name: Download bundled pip wheels
        shell: bash -l {0}
        run: |
          python constructor/fetch_wheels.py --platform ${{ matrix.platform }}

      - name: Build installer with constructor
        shell: bash -l {0}
        run: |
          constructor constructor/ --output-dir dist

      - name: Rename installer
        shell: bash
        run: |
          SRC=$(find dist -maxdepth 1 -iname "*.${{ matrix.ext }}" | head -n 1)
          echo "Built installer: $SRC"
          cp "$SRC" "dist/${{ matrix.final }}"

      # Install for real (Linux only; runs in parallel with the Windows build so
      # it adds no wall-clock time) and check the offline wheel install worked.
      - name: Smoke-test installer
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          PREFIX_DIR="$RUNNER_TEMP/osdagbridge-test"
          START=$(date +%s)
          bash "dist/${{ matrix.final }}" -b -p "$PREFIX_DIR"
          echo "Install took $(( $(date +%s) - START ))s"
          test ! -d "$PREFIX_DIR/osdagbridge_wheels" || { echo "wheel dir not cleaned up" >&2; exit 1; }
          MPLBACKEND=Agg "$PREFIX_DIR/bin/python" -c "import openseespy.opensees, opsvis, osdagbridge_core, osdagbridge_desktop; print('imports OK')"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.final }}

  release:
    name: Create GitHub Release
    needs: build-installer
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: linux-installer
          path: dist

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OsdagBridge-Setup.exe
            dist/OsdagBridge-Linux.sh
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
